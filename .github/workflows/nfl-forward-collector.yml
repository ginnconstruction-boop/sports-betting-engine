name: NFL forward research collector

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Chicago'
    - cron: '0 14 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and plan without writing archive records'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nfl-forward-research-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sports-betting-engine
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NFL_FORWARD_RESEARCH_ROOT: ${{ github.workspace }}/sports-betting-engine/research/nfl-forward-archive
      NFL_FORWARD_SCHEDULER_CONFIGURED: 'true'
      NFL_FORWARD_DURABLE_STORAGE: 'git'
      NFL_FORWARD_IDEMPOTENCY_KEY: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sports-betting-engine/package-lock.json

      - run: npm ci

      - name: Verify the market provider secret
        shell: bash
        run: test -n "${ODDS_API_KEY}" || { echo "ODDS_API_KEY is not configured."; exit 1; }

      - name: Select explicit capture trigger
        id: protocol
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger=MANUAL" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
            echo "trigger=SCHEDULED_0700_CT" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=SCHEDULED_1400_CT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shared bounded collector
        shell: bash
        run: |
          dry_flag=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry_flag="--dry-run"
          fi
          npm run research:nfl-forward-collect -- --trigger=${{ steps.protocol.outputs.trigger }} --idempotency-key=${NFL_FORWARD_IDEMPOTENCY_KEY} ${dry_flag}

      - name: Verify archive before persistence
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm run research:nfl-forward-verify

      - name: Persist authoritative immutable archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          git config user.name "nfl-forward-collector"
          git config user.email "nfl-forward-collector@users.noreply.github.com"
          git add research/nfl-forward-archive
          if git diff --cached --quiet; then
            echo "No new immutable records to persist."
          else
            git commit -m "chore(research): archive NFL forward collection [skip render]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
